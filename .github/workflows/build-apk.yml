          else:
              print("No index.html found in repository; using built-in embedded Maths Manthan index.html")
              raw_bytes = lzma.decompress(base64.b64decode(EMBEDDED_HTML_XZ_B64.strip()))
              content = raw_bytes.decode("utf-8")

          # Safeguard: if the HTML content was accidentally pasted multiple times in a row, keep only the first complete document
          parts = re.split(r"(?i)<!DOCTYPE\s+html>", content)
          if len(parts) > 2:
              print(f"Detected {len(parts)-1} concatenated HTML copies; deduplicating to single clean document.")
              content = "<!DOCTYPE html>" + parts[1]

          with open(target_asset_html, "w", encoding="utf-8") as f:
              f.write(content)

