          target_asset_html = os.path.join(ASSETS_DIR, "index.html")
          if html_src and os.path.exists(html_src):
              print(f"Using HTML source from repository: {html_src}")
              with open(html_src, "r", encoding="utf-8", errors="replace") as f:
