              "web/index.html",
          ]
          if not html_src:
              for p in common_locations:
                  if os.path.exists(p):
                      html_src = p
                      break
          if not html_src or not os.path.exists(html_src):
              candidates = [
                  p for p in glob.glob("**/*.html", recursive=True)
                  if not p.startswith("android-app")
              ]
              if candidates:
